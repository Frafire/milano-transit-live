<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Milano Transit Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=Doto:wght@700;900&family=VT323&display=swap">
<style>
/* The menu: a blurred city photo behind translucent navy tiles (modern), with the game's own pieces on top:
   the platform screen (Doto) for the title and the "In arrivo" tags, the pixel signals beside Gioca!.
   Three steps on one page (#mezzo, #metro in the address); what can be played comes from data/linee.json. */
:root {
  --night: #0b2233;
  --tile: rgba(30, 86, 122, .78);
  --tile-hi: rgba(42, 112, 156, .9);
  --fg: #ffffff;
  --muted: rgba(255,255,255,.72);
  --signal: #ffcf3f;
  --live: #e5383b;
  --led: #ff9416;
  --crt: #8dff9e;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --dots: "Doto", "Courier New", monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--night); color: var(--fg); font: 15px/1.4 var(--body); }
.bg { position: fixed; inset: -40px; z-index: 0; background: none center / cover no-repeat; filter: blur(16px) saturate(1.1); transform: scale(1.06); }
.bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,34,51,.55), rgba(11,34,51,.82)); }
.net { position: fixed; z-index: 0; left: 50%; top: 55%; width: min(1300px, 140vw); transform: translate(-50%, -50%); opacity: .2; filter: blur(1.5px); pointer-events: none; }
.wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px;
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header (steps 2 and 3) */
header { display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap; }
.word { font: 800 22px/0.92 var(--display); text-transform: uppercase; letter-spacing: .02em; text-shadow: 0 2px 8px rgba(0,0,0,.4); color: inherit; text-decoration: none; }
.word .t { display: inline-block; background: var(--signal); color: var(--night); padding: 1px 6px 0; margin: 2px 0; }
.word .l { display: flex; align-items: center; gap: 6px; font-size: 30px; }
.word .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 3px rgba(229,56,59,.3); animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 104px; padding: 10px 12px 8px; color: var(--muted); font: 700 13px var(--display); letter-spacing: .08em; text-transform: uppercase; background: none; border: 0; cursor: pointer; }
.tab svg { width: 30px; height: 30px; }
.tab[aria-current=step] { background: rgba(255,207,63,.92); color: var(--night); }
.tab:hover:not([aria-current=step]) { color: #fff; }
.tab:focus-visible, .word:focus-visible { outline: 3px solid var(--crt); outline-offset: 2px; }

/* LED board (the platform screens of the game) */
.case { background: linear-gradient(180deg, #b4b9be, #8a9096 60%, #7a8086); border-radius: 10px; padding: 10px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 0 rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.45); }
.screen { position: relative; background: #0b0a08; border: 3px solid #4b5055; border-radius: 3px; overflow: hidden;
  color: var(--led); font-family: var(--dots); font-weight: 900; text-shadow: 0 0 6px rgba(255,140,20,.65); }
.screen::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, transparent 52%, rgba(0,0,0,.6) 62%); background-size: 3px 3px; }
.case-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 7px; }
.plate { background: #eceded; color: #1d1d1d; font: 600 12px var(--body); padding: 2px 8px; border-radius: 3px; }
.grille { width: 54px; height: 8px; background: repeating-linear-gradient(90deg, #5d6268 0 2px, transparent 2px 5px); border-radius: 2px; opacity: .8; }

/* step 1 */
#avvio { flex: 1; display: grid; place-items: center; min-width: 0; width: 100%; }
.start { display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; padding-block: 6vh; width: 100%; min-width: 0; box-sizing: border-box; }
.start .case { width: 100%; max-width: 720px; box-sizing: border-box; min-width: 0; }
.title { margin: 0; padding: 22px 18px 10px; font-size: clamp(30px, 7.4vw, 66px); font-weight: 900; line-height: 1.02; letter-spacing: .04em; text-wrap: balance; }
.title small { display: block; font-size: .42em; letter-spacing: .3em; margin-top: 10px; opacity: .9; }
.ticker { border-top: 2px solid #1d1a14; padding: 6px 0 8px; white-space: nowrap; overflow: hidden; font-size: clamp(15px, 2.6vw, 22px); letter-spacing: .08em; }
.ticker span { display: inline-block; padding-left: 100%; animation: run 18s linear infinite; }
@keyframes run { to { transform: translateX(-100%); } }
.go { display: flex; align-items: center; gap: 18px; }
.sig { width: 22px; height: 36px; image-rendering: pixelated; filter: drop-shadow(0 0 4px rgba(255,60,40,.35)); }
.sig.on { display: none; }
.go:hover .sig.off, .go:focus-within .sig.off { display: none; }
.go:hover .sig.on, .go:focus-within .sig.on { display: block; filter: drop-shadow(0 0 5px rgba(255,255,255,.45)); }
.cta { font: 800 30px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--night); background: var(--signal); border: 2px solid var(--signal); padding: 16px 56px; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.cta:hover, .cta:focus-visible { background: #fff; border-color: #fff; outline: none; }

/* tiles */
.grid { display: grid; gap: 10px; }
.tile { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; text-align: left;
  min-height: 210px; padding: 12px 14px; color: var(--fg); font: inherit; cursor: pointer;
  background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,.18)), var(--tile); border: 2px solid transparent; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.tile::before { content: ''; position: absolute; left: 50%; top: 0; width: 64%; height: 100%; transform: translateX(-50%);
  clip-path: polygon(28% 0, 72% 0, 100% 100%, 0 100%); background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.02)); pointer-events: none; }
.tile .ring { position: absolute; left: 50%; top: 44%; width: 46%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 14px solid rgba(255,255,255,.07); }
.tile .ico { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); width: 40%; max-width: 170px; display: grid; place-items: center; }
.tile .ico svg, .tile .ico img { width: 100%; height: auto; filter: drop-shadow(0 4px 10px rgba(0,0,0,.3)); }
.tile .lab { position: relative; font: 700 clamp(16px, 2.2vw, 22px)/1.1 var(--display); letter-spacing: .05em; text-transform: uppercase; }
.tile .desc { position: relative; font-size: 12.5px; line-height: 1.3; color: var(--muted); max-width: 36ch; max-height: 0; overflow: hidden; transition: max-height .2s; }
.tile:not(.off):hover, .tile:not(.off):focus-visible { border-color: #fff; background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,.18)), var(--tile-hi); outline: none; }
.tile:not(.off):hover .desc, .tile:not(.off):focus-visible .desc { max-height: 4em; }
.tile:not(.off):hover::after, .tile:not(.off):focus-visible::after { content: ''; position: absolute; top: 0; left: 0; border: 9px solid transparent; border-top-color: #fff; border-left-color: #fff; }
.tile.off { cursor: not-allowed; background: rgba(36,52,64,.72); }
.tile.off .ico, .tile.off .lab, .tile.off .ring, .tile.off .stripe { filter: grayscale(1); opacity: .5; }
.tag { position: absolute; top: 10px; right: 10px; z-index: 1; font: 900 12px/1 var(--dots); letter-spacing: .08em; text-transform: uppercase; padding: 6px 8px 5px; background: #0b0a08; border: 2px solid #4b5055; border-radius: 3px; }
.tag.soon { color: var(--led); text-shadow: 0 0 5px rgba(255,140,20,.65); }
.tag.ok { color: var(--crt); text-shadow: 0 0 5px rgba(120,255,150,.55); }
.tag.test { color: #8fd3ff; text-shadow: 0 0 5px rgba(120,200,255,.6); }
.tile .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; }

#mezzo .grid { grid-template-columns: repeat(3, 1fr); }
#mezzo .tile { min-height: 300px; }
#mezzo .all { grid-column: 1 / -1; min-height: 76px; flex-direction: row; align-items: center; justify-content: flex-start; gap: 14px; }
#mezzo .all .ico { position: static; transform: none; width: 44px; }
#mezzo .all::before, #mezzo .all .ring { display: none; }

#metro .grid { grid-template-columns: repeat(4, 1fr); }
#metro .tile { min-height: 250px; }
#metro .tile .ico { width: 54%; }
#metro .tile .ico img { border-radius: 8px; }
#metro .pair .ico { display: flex; gap: 8px; width: 80%; }
#metro .pair .ico img { width: 50%; }
#metro .wide { grid-column: span 2; min-height: 80px; flex-direction: row; align-items: center; gap: 12px; justify-content: flex-start; }
#metro .wide::before, #metro .wide .ring { display: none; }
#metro .wide .ico { position: static; transform: none; display: flex; gap: 4px; width: auto; }
#metro .wide .ico img { height: 26px; width: auto; border-radius: 3px; }

.foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 12px; margin-top: auto; }
.foot a { color: inherit; }
.toast { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; width: min(440px, calc(100vw - 32px)); box-sizing: border-box;
  background: #071109; border: 4px solid #2a3a2e; box-shadow: 0 0 0 2px #000, 0 10px 30px rgba(0,0,0,.6); font: 19px/1.2 "VT323", ui-monospace, monospace; color: var(--crt); padding: 10px 12px; }

@media (max-width: 760px) {
  .tabs { margin-left: 0; width: 100%; } .tab { flex: 1; min-width: 0; padding-inline: 4px; font-size: 12px; }
  #mezzo .grid { grid-template-columns: 1fr 1fr; } #mezzo .tile:first-child { grid-column: 1 / -1; min-height: 220px; } #mezzo .tile { min-height: 170px; }
  #metro .grid { grid-template-columns: 1fr 1fr; } #metro .tile { min-height: 170px; }
  #metro .pair, #metro .wide, #metro .tile.big { grid-column: 1 / -1; } #metro .tile.big .ico { width: 30%; }
  #mezzo .all, #metro .wide { min-height: 64px; }
  .tile .desc { display: none; } .tag { font-size: 10px; padding: 4px 5px; } .go { gap: 10px; } .cta { padding-inline: 32px; }
}
@media (prefers-reduced-motion: reduce) { .word .l i { animation: none; } .ticker span { animation: none; padding-left: 12px; } .tile .desc { transition: none; } }

/* ---- the line card ("i" on a line's tile) and the choice of the timetable (Giovanni 10 Nov 2026, from the draft of the
   graphics chat). --y: the colour of the line whose card is open (M3 #fbb816; M1 #e5392f, M2 #5e9732, M4 #1d3a6b, M5 #998ec4) */
:root { --y: #fbb816; }
.led { display: inline-block; background: #0b0a08; border: 2px solid #4b5055; border-radius: 3px; color: var(--led); font: 900 15px/1 var(--dots); padding: 4px 6px 3px; text-shadow: 0 0 5px rgba(255,140,20,.6); }
.tilewrap { position: relative; display: grid; }
.tilewrap > .tile { min-width: 0; }
.info { position: absolute; top: 10px; left: 10px; z-index: 2; width: 34px; height: 34px; padding: 0; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.45); border: 2px solid var(--y); color: var(--y); font: italic 800 19px/1 Georgia, "Times New Roman", serif; cursor: pointer; }
.info:hover, .info:focus-visible { background: var(--y); color: var(--night); outline: none; }
.info-l { position: absolute; top: 16px; left: 50px; z-index: 2; font: 700 12px var(--display); letter-spacing: .08em; text-transform: uppercase; background: rgba(0,0,0,.6); padding: 4px 7px; pointer-events: none; opacity: 0; transition: opacity .15s; }
.info:hover + .info-l, .info:focus-visible + .info-l { opacity: 1; }
.ls { position: fixed; inset: 0; z-index: 40; background: var(--night); overflow: auto; }
.ls-in { max-width: 1000px; margin: 0 auto; padding-bottom: 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ls-hd { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
.ls-hd img { height: 56px; border-radius: 8px; }
.ls-hd h1 { margin: 0; font: 800 clamp(28px, 5vw, 44px)/1 var(--display); text-transform: uppercase; color: var(--y); }
.ls-hd p { margin: 4px 0 0; font: 600 16px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ls-hd .act { margin-left: auto; display: flex; gap: 8px; }
.ls-hd .act button { font: 800 15px var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 10px 16px; cursor: pointer; border: 2px solid var(--y); }
.ls-hd .play2 { background: var(--y); color: var(--night); }
.ls-hd .close2 { background: none; color: #fff; border-color: rgba(255,255,255,.4); }
.ls-nav { position: sticky; top: 0; z-index: 5; background: var(--night); display: flex; gap: 2px; margin: 14px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; padding: 0 max(16px, env(safe-area-inset-left, 0px)); overflow-x: auto; border-bottom: 2px solid rgba(255,255,255,.12); scrollbar-width: none; }
.ls-nav a { flex: none; padding: 12px 14px 10px; color: var(--muted); font: 700 15px var(--display); letter-spacing: .06em; text-transform: uppercase; text-decoration: none; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.ls-nav a.on { color: var(--y); border-bottom-color: var(--y); }
.ls-nav a.soon { opacity: .45; }
.ls section { scroll-margin-top: 60px; padding-top: 18px; }
.ls section + section { border-top: 1px solid rgba(255,255,255,.1); margin-top: 26px; }
.ls h2 { font: 800 30px/1.1 var(--display); color: var(--y); text-transform: uppercase; margin: 10px 0 12px; }
.ls h3 { font: 800 20px/1.15 var(--display); color: var(--y); text-transform: uppercase; letter-spacing: .02em; margin: 20px 0 8px; }
.ls h4 { font: 800 17px/1.15 var(--display); color: var(--y); text-transform: uppercase; letter-spacing: .03em; margin: 0 0 6px; }
.ls p { margin: 0 0 12px; max-width: 70ch; font-size: 15.5px; line-height: 1.6; color: rgba(255,255,255,.9); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
.stat { background: var(--tile); padding: 12px 14px; }
.stat b { display: block; font: 800 32px/1 var(--display); color: var(--y); }
.stat span { font: 600 13px var(--body); color: var(--muted); }
.lmap { overflow-x: auto; margin-top: 14px; background: rgba(0,0,0,.2); padding: 6px 0; }
.lmap svg { display: block; }
.leg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.leg i { display: inline-block; width: 18px; height: 5px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }
.tl { list-style: none; margin: 8px 0 0; padding: 0; border-left: 3px solid var(--y); }
.tl li { position: relative; padding: 0 0 16px 22px; }
.tl li::before { content: ''; position: absolute; left: -9px; top: 6px; width: 15px; height: 15px; box-sizing: border-box; border-radius: 50%; background: var(--night); border: 3px solid var(--y); }
.tl .led { margin-bottom: 6px; }
.playday { display: inline-block; font: 700 12px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px dashed rgba(255,255,255,.3); padding: 3px 8px; }
.ls .src { font-size: 12px; color: var(--muted); }
.warn { background: rgba(255,207,63,.12); border-left: 4px solid var(--y); padding: 8px 12px; font-size: 13px; margin: 4px 0 14px; max-width: 70ch; }
.ask { background: rgba(127,212,255,.1); border-left: 4px solid #7fd4ff; padding: 8px 12px; font-size: 13.5px; margin: 8px 0; max-width: 70ch; }
.fam { background: var(--tile); padding: 14px; margin-top: 14px; display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
.fam > * { min-width: 0; }
.fam .side { display: grid; gap: 8px; align-content: start; }
.fam .ph { min-height: 120px; display: grid; place-items: center; background: rgba(0,0,0,.25); border: 1px dashed rgba(255,255,255,.25); color: var(--muted); font: 600 12.5px var(--body); text-align: center; padding: 6px; }
.fam dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0 0 8px; font-size: 14px; }
.fam dt { color: var(--muted); } .fam dd { margin: 0; }
.media { display: flex; gap: 6px; flex-wrap: wrap; }
.media span { font: 700 11.5px var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; background: rgba(0,0,0,.3); color: var(--muted); }
.mat { overflow-x: auto; min-width: 0; }
.mat table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.mat th { text-align: left; font: 700 12px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,.2); }
.mat td { padding: 5px 8px; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: top; }
.mat td:first-child { font: 700 14px var(--display); letter-spacing: .03em; white-space: nowrap; }
.mat td:nth-child(4) { white-space: nowrap; }
.mat tr.old td { color: var(--muted); }
.badge { display: inline-block; font: 700 11px var(--display); letter-spacing: .1em; text-transform: uppercase; background: rgba(255,255,255,.12); padding: 2px 6px; margin-left: 6px; vertical-align: middle; color: var(--muted); }
.sigs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 8px; }
.sig2 { display: flex; gap: 14px; align-items: center; background: var(--tile); padding: 12px 14px; }
.sig2 img { width: 44px; height: 72px; image-rendering: pixelated; flex: none; }
.sig2 svg { flex: none; }
.sig2 b { display: block; font: 800 17px var(--display); text-transform: uppercase; color: var(--y); }
.sig2 span { font-size: 13.5px; color: rgba(255,255,255,.85); }
.pick { position: fixed; inset: 0; z-index: 35; background: var(--night); overflow: auto; }
.pick-in { max-width: 1080px; margin: 0 auto; min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pick-hd { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pick-hd img { height: 46px; border-radius: 6px; }
.pick-hd .case { flex: 1; min-width: 0; padding: 6px; border-radius: 7px; }
.pick-hd .screen { padding: 6px 12px; font-size: clamp(16px, 3vw, 24px); letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick-hd .back { font: 700 14px var(--display); letter-spacing: .08em; text-transform: uppercase; background: none; color: #fff; border: 1px solid rgba(255,255,255,.4); padding: 9px 14px; cursor: pointer; }
.pick-grid { flex: 1; display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; min-height: 420px; }
.pick-r { display: grid; grid-template-rows: 1fr 1fr; gap: 12px; }
.pp { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; text-align: left; padding: 18px 20px; cursor: pointer; color: #fff; font: inherit;
  background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,.25)), var(--tile); border: 2px solid transparent; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.pp:hover, .pp:focus-visible { border-color: #fff; background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,.25)), var(--tile-hi); outline: none; }
.pp::before { content: ''; position: absolute; left: 50%; top: 0; width: 60%; height: 100%; transform: translateX(-50%); clip-path: polygon(28% 0, 72% 0, 100% 100%, 0 100%); background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.02)); pointer-events: none; }
.pp .pic { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); width: 34%; max-width: 190px; }
.pp.big .pic { width: 30%; }
.pp .t { position: relative; font: 800 clamp(22px, 3.4vw, 34px)/1 var(--display); text-transform: uppercase; color: var(--y); }
.pp .d { position: relative; font-size: 14px; color: var(--muted); max-width: 46ch; }
.pp .when { position: absolute; top: 14px; left: 16px; font-size: 16px; padding: 5px 7px 4px; }
.pp .tag { top: 14px; right: 14px; }
.pp.soon .pic, .pp.soon .t, .pp.soon .d { opacity: .75; }
@media (max-width: 760px) {
  #metro .tilewrap.big { grid-column: 1 / -1; }
  .fam { grid-template-columns: 1fr; } .ls-hd .act { margin-left: 0; width: 100%; } .ls-hd .act button { flex: 1; }
  .pick-grid { grid-template-columns: 1fr; } .pick-r { grid-template-rows: auto; } .pp { min-height: 230px; } .pp .pic, .pp.big .pic { top: 34%; width: 22%; }
}
@media (prefers-reduced-motion: reduce) { .info-l { transition: none; } }
</style>
</head>

<script>
// what can be played: data/linee.json, put here by tools/assemble.py
const LINEE = {"M1": "in arrivo", "M2": "in test", "M3": "giocabile", "M4": "in arrivo", "M5": "in arrivo", "M1+M2+M3": "in arrivo", "metro-tutte": "in arrivo", "tram": "in arrivo", "bus": "in arrivo", "rete": "in arrivo"};
// "in test": it can be opened, to try it while it is being built (not finished: the tile says so)
const ok = k => k.split(/[,]/).some(x => LINEE[x] === 'giocabile' || LINEE[x] === 'in test');
const inTest = k => !k.split(/[,]/).some(x => LINEE[x] === 'giocabile') && k.split(/[,]/).some(x => LINEE[x] === 'in test');
const metroLines = ['M1', 'M2', 'M3', 'M4', 'M5'].filter(l => LINEE[l] === 'giocabile');
if (!LINEE.metro) LINEE.metro = metroLines.length ? 'giocabile' : 'in arrivo';
const gioca = k => 'gioca.html?linee=' + (k === 'metro-tutte' ? ['M1', 'M2', 'M3', 'M4', 'M5'] : k.split(/[+,]/)).join(',');

document.querySelectorAll('.tile[data-k]').forEach(b => {
  const k = b.dataset.k, yes = ok(k);
  const test = yes && inTest(k), tag = document.createElement('span'); tag.className = 'tag ' + (test ? 'test' : yes ? 'ok' : 'soon');
  tag.textContent = test ? 'In test' : yes ? (k === 'metro' ? metroLines.join(' ') + ' giocabile' : 'Giocabile') : 'In arrivo';
  b.prepend(tag);
  if (!yes) { b.classList.add('off'); b.setAttribute('aria-disabled', 'true'); b.onclick = () => toast('IN ARRIVO. Per ora si gioca solo: ' + metroLines.join(', ') + '.'); return; }
  if (/^M\d$/.test(k) && b.closest('#metro')) b.classList.add('big');
  b.onclick = b.dataset.to != null ? () => go(b.dataset.to) : () => { location.href = gioca(k); };
});

const views = ['avvio', 'mezzo', 'metro'];
function go(v) { location.hash = v; }
function show() {
  const v = views.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'avvio';
  views.forEach(id => document.getElementById(id).hidden = id !== v);
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', (t.dataset.to || 'avvio') === v ? 'step' : 'false'));
  document.getElementById('hdr').hidden = v === 'avvio';
  document.getElementById('net').hidden = v !== 'metro';
  document.getElementById('toast').hidden = true;
}
addEventListener('hashchange', show); show();
document.getElementById('play').onclick = () => go('mezzo');
document.querySelectorAll('.tab').forEach(t => t.onclick = () => go(t.dataset.to));
document.querySelector('.word').onclick = e => { e.preventDefault(); go(''); };
let tt;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3200); }
// ---- the line cards and the choice of the timetable (Giovanni 10 Nov 2026) ----
// SCHEDE: data/schede/<line>.json with what the build knows (tools/assemble.py); ORARI: data/linee.json "orari"
const SCHEDE = {"M3":{"_about":"Scheda della linea M3 nel menu (Giovanni 10/11/2026, dalla bozza della chat grafica). Testi per sezione, con le fonti; provvisorio: true = testo da Wikipedia, da sostituire. I numeri (stazioni, km, treni) e le righe delle tabelle dei treni in servizio li mette tools/assemble.py dalla build (orario, flotta del gioco); qui solo l'elenco storico delle unità fuori servizio e gli anni di apertura delle stazioni.","linea":"M3","titolo":"Linea M3","sottotitolo":"Comasina – San Donato · la linea gialla","colore":"#fbb816","sezioni":[{"id":"breve","titolo":"In breve","apertura":{"anno":"1990","testo":"prima tratta aperta, Centrale FS – Duomo"},"depositi":1,"testo":"La linea gialla collega Comasina, a nord, con San Donato, appena fuori città a sud-est, passando per Centrale FS, Duomo e Rogoredo FS.","fonti":["Stazioni e km: dal tracciato dell'orario; treni: dalla flotta del gioco (calcolati nella build)"],"numeri":[["21","stazioni"],["15,6 km","tra Comasina e San Donato, sul tracciato dell'orario"],["1990","prima tratta aperta, Centrale FS – Duomo"],["1","deposito"],["29","treni nella flotta del gioco"]]},{"id":"storia","titolo":"Storia","provvisorio":true,"avviso":"Testo provvisorio da Wikipedia (voce \"Linea M3 della metropolitana di Milano\", CC BY-SA 4.0), solo per l'impaginazione. Sarà sostituito con testo nostro da altre fonti.","paragrafi":["La M3 è la terza linea della metropolitana milanese in ordine di costruzione. Il consiglio comunale la approvò nel 1977, partendo da un'indagine sugli spostamenti in città fatta tra il 1976 e il 1977.","Tra Repubblica e Crocetta la linea corre in due gallerie sovrapposte, per passare sotto le strade strette del centro senza toccare gli edifici. Le cinque stazioni di questa tratta sfruttano l'esperienza di Sant'Agostino sulla M2, costruita allo stesso modo."],"tappe":[{"data":"1977","titolo":"Approvata","testo":"Ordine del giorno del consiglio comunale."},{"data":"1981","titolo":"Progetto e cantieri","testo":"Il progetto di MM arriva al Ministero dei trasporti l'11 gennaio; i lavori partono l'8 settembre."},{"data":"03.05.1990","titolo":"Centrale FS – Duomo","testo":"Prima tratta: 2,65 km e cinque stazioni, in tempo per i Mondiali. A Duomo i due binari sono su livelli diversi e non si collegano, quindi girano due navette, ognuna sempre sullo stesso binario, ogni nove minuti.","giornata_speciale":true},{"data":"16.12.1990","titolo":"Fino a Porta Romana","testo":"Porta Romana ha una comunicazione tra i binari: finiscono le navette e i treni girano come su una linea normale."},{"data":"12.05.1991","titolo":"Sondrio e San Donato","testo":"Aprono Centrale FS – Sondrio a nord e Porta Romana – San Donato a sud, con l'interscambio di Rogoredo FS."},{"data":"05.1993","titolo":"Via i tram da Corso Lodi","testo":"Tram e metropolitana insieme in Corso Lodi non funzionano bene: i tram vengono limitati a Crocetta."},{"data":"ANNI 90","titolo":"Treni corti la sera","testo":"Fino ai primi anni 2000, le corse della sera tardi e le prime del mattino le faceva di solito una sola unità di trazione, senza accoppiamento."},{"data":"16.12.1995","titolo":"Zara","testo":"Prolungamento da Sondrio a Zara, senza fermate intermedie."},{"data":"08.12.2003","titolo":"Maciachini e il 2° lotto","testo":"Prolungamento da Zara a Maciachini. Con l'apertura arrivano i treni del 2° lotto: intercomunicanti, con aria condizionata, porte elettriche e indicatori a LED."},{"data":"2009","titolo":"Arrivano i Meneghino","testo":"Fino a quest'anno sulla M3 girano solo i Tradizionali. Entrano in servizio i primi Meneghino, costruiti da AnsaldoBreda e Firema per M1, M2 e M3."},{"data":"09.2010","titolo":"Il Seveso allaga la linea","testo":"Il Seveso esonda e, insieme alla rottura di una tubazione dell'acquedotto al cantiere Istria della M5, allaga gallerie e stazioni della M3 tra Maciachini e Repubblica: circa 150 mila metri cubi d'acqua, aspirati in un centinaio di ore. La linea resta regolare tra San Donato e Centrale; tra Centrale e Maciachini corrono i bus sostitutivi. Sondrio resta chiusa dal 19 al 27 settembre. Un treno rimane sott'acqua: le unità 8041-8042 e 8043-8044 vengono accantonate.","giornata_speciale":true},{"data":"26.03.2011","titolo":"Comasina","testo":"Prolungamento sotterraneo da Maciachini a Comasina, con Dergano, Affori Centro e Affori FN.","giornata_speciale":true},{"data":"11.2014","titolo":"Di nuovo il Seveso","testo":"Sondrio chiusa il 15 e 16 novembre per un'altra esondazione."},{"data":"2015","titolo":"Expo","testo":"Dal 1° maggio al 31 ottobre Milano ospita l'Esposizione Universale e tutta la rete è chiamata allo sforzo. Dal 30 maggio Expo resta aperta fino a mezzanotte nei fine settimana e nei festivi: la M1 porta l'ultimo treno da Rho alle 1:10, M2, M3 e M5 vengono potenziate e prolungate per le coincidenze. Di notte la rete dei bus notturni gira tutti i giorni, e al posto della M3 c'è il 153.","giornata_speciale":true},{"data":"ESTATE 2018","titolo":"Revisione del 1° lotto","testo":"Prima vera revisione dei treni dal 1990: nuova illuminazione, interni riverniciati, porte e indicatori rinnovati, annunci vocali delle fermate."},{"data":"2019","titolo":"Via i SOCIMI","testo":"Le sei unità del 1° lotto costruite da SOCIMI, 8069-8080, vengono accantonate. Oggi sono demolite."},{"data":"04.11.2022","titolo":"Accordo con Hitachi Rail","testo":"ATM affida a Hitachi Rail un accordo quadro per 46 treni nuovi per M1, M2 e M3, per 368 milioni di euro; il primo contratto riguarda 21 treni per la M1. Si costruiscono a Napoli e Reggio Calabria: 6 casse in alluminio, 106,5 m, fino a 90 km/h, aria condizionata e videosorveglianza vista in tempo reale dalla sala operativa."},{"data":"31.10.2023","titolo":"Sondrio chiusa","testo":"Ancora il Seveso: la stazione chiude per un giorno."},{"data":"01–03.2026","titolo":"Milano Cortina","testo":"Le Olimpiadi invernali chiedono un altro sforzo. Dal 5 al 22 febbraio la metropolitana resta aperta fino alle 2 di notte sulla rete urbana, poi i bus notturni dalle 2:30 alle 5:30. Sulla M3 il servizio prolungato porta il pubblico all'Arena Santa Giulia, quella dell'hockey. Per le Paralimpiadi, dal 7 al 15 marzo, la metro chiude all'1.","giornata_speciale":true},{"data":"02.2026","titolo":"Arriva il primo Galileo","testo":"Arriva 9201-9202, il primo Hitachi \"Galileo\" della M3, con i bordi gialli: per ora fa solo giri di prova sull'anello del deposito. Dei 46 Galileo ordinati, 25 sono per la M3 e prenderanno il posto dei Tradizionali."}],"fonti":["Fonti: Wikipedia, voci \"Linea M3\", \"Sondrio\" e \"Elettromotrici della linea 3\" (CC BY-SA 4.0, provvisorie); articolo di cronaca sull'allagamento del 2010 (testata da indicare); Il Sole 24 Ore, M. Morino, 4/11/2022; <a href=\"https://www.ilpost.it/2015/05/26/expo-mezzanotte-weekend/\" style=\"color:inherit\">Il Post, 26/5/2015</a>; <a href=\"https://www.lapresse.it/cronaca/2015/04/30/expo-come-muoversi-a-milano-durante-lesposizione-universale/\" style=\"color:inherit\">LaPresse, 30/4/2015</a>; <a href=\"https://www.mentelocale.it/milano/110704-atm-milano-servizio-potenziato-durante-le-olimpiadi-fino-a-che-ora-aperta-la-metropolitana.htm\" style=\"color:inherit\">Mentelocale, 4/2/2026</a>; <a href=\"https://www.ilgiorno.it/milano/cronaca/mobilita-il-piano-olimpico-metro-fdacbd2b\" style=\"color:inherit\">Il Giorno</a>; Giovanni (treni corti, flotta, Galileo, Arena Santa Giulia)."],"crescita":{"provvisorio":true,"nota":"Dalle date della Storia, provvisorie. Missori e Crocetta a dicembre 1990 sono una deduzione.","fasi":[{"nome":"1990 · maggio","colore":"#fbb816","quando":"1990-05"},{"nome":"1990 · dicembre","colore":"#ffd862","quando":"1990-12"},{"nome":"1991","colore":"#ff9e3d","quando":"1991-05"},{"nome":"1995","colore":"#7fd4ff","quando":"1995-12"},{"nome":"2003","colore":"#b38bff","quando":"2003-12"},{"nome":"2011","colore":"#6fe39a","quando":"2011-03"}],"stazioni":[{"nome":"Comasina","aperta":"2011-03"},{"nome":"Affori FN","aperta": e pannelli della mostra ATM sugli apparati Siemens."],"blocchi":[{"titolo":"Blocco e guida","paragrafi":["Siemens LZB 700M a blocco fisso, dall'apertura. Partenza, fermata, distanziamento e velocità li gestisce il treno (ATP e ATO) con le informazioni che arrivano da terra. I segnali di linea ci sono comunque.","Il macchinista apre e chiude le porte e dà il consenso alla partenza. Guida a mano solo negli imprevisti, come persone o oggetti sul binario, o quando si guasta il segnalamento o il treno."]},{"titolo":"I tre apparati di bordo","paragrafi":["<b>ATP</b>, informazione dell'andatura: con le antenne riceve dal binario un segnale codificato con i parametri di marcia lungo tutto il percorso, e sa dove si trova il treno davanti, così i treni si distanziano in modo uniforme e le attese in stazione si accorciano.","<b>ATO</b>, marcia automatica: collegato all'ATP, guida il treno da solo. Al macchinista restano il consenso all'apertura e alla chiusura delle porte e il consenso alla partenza; poi il treno accelera, rallenta e si ferma in stazione da solo. In qualsiasi momento il macchinista può passare alla guida manuale, sempre sorvegliato dall'ATP.","<b>ZUB</b>, sicurezza del segnalamento a terra: le antenne leggono le boe messe lungo la linea, di solito vicino alle stazioni e agli scambi, che trasmettono gli aspetti dei segnali. Se il macchinista non rispetta un segnale, lo ZUB ferma subito il treno.","L'LZB copre solo la linea: in deposito si guida sempre a mano.","<b>ATP continuo:</b> la marcia normale, con lo stato della linea ricevuto di continuo. <b>ATP discontinuo (ZUB):</b> solo per la prima corsa dei due treni che partono da ogni capolinea, o quando il continuo è degradato. Si va da stazione a stazione, leggendo le spire messe prima dei segnali di partenza."]},{"titolo":"Gli aspetti","paragrafi":[],"aspetti":[{"sprite":"stop","nome":"Rosso","testo":"Via impedita imperativa: fermarsi."},{"sprite":"go","nome":"Rosso e bianco","testo":"Via libera."}]},{"titolo" const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

// the card
const vela = legal => { const W = 13, H = 21, PH = 18, C = 4, cut = legal ? 2 : 0; let r = '';
  const inPlate = (x, y) => y >= 0 && y < PH && x >= 0 && x < W && !(Math.min(x, W - 1 - x) + Math.min(y, PH - 1 - y) < cut);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { let c = null;
    if (y < PH) { if (!inPlate(x, y)) continue; const edge = !inPlate(x - 1, y) || !inPlate(x + 1, y) || !inPlate(x, y - 1) || !inPlate(x, y + 1);
      const lamp = (cx, cy) => Math.hypot(x - cx, y - cy) <= 2.3;
      c = edge ? '#c9d1d6' : lamp(6, 5) ? '#ff2a2a' : lamp(6, 12) ? '#3b3f46' : '#1d2024'; }

  return `<svg width="${W * C}" height="${H * C}" viewBox="0 0 ${W * C} ${H * C}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`; };
function cardHtml(k) {
  const S = SCHEDE[k], sec = id => S.sezioni.find(s => s.id === id) || {}, src = s => (s.fonti || []).length ? `<p class="src">Fonti: ${s.fonti.join(' ')}</p>` : '';
  const tappe = l => `<ol class="tl">${l.map(t => `<li>${t.data ? `<span class="led">${esc(t.data)}</span>` : ''}<h4>${t.titolo}</h4><p>${t.testo}</p>${t.giornata_speciale ? '<span class="playday">Giornata speciale · in arrivo</span>' : ''}</li>`).join('')}</ol>`;

      h += src(s); }
    else if (s.id === 'treni') { h += `<p>${s.intro}</p><h3>${esc(s.tradizionali.titolo)}</h3>${s.tradizionali.paragrafi.map((p, i, a) => `<p>${p}${i === a.length - 1 ? ` <span class="badge">${esc(s.tradizionali.foto)}</span>` : ''}</p>`).join('')}`;
      for (const g of s.gruppi) { const cols = g.colonne || ['Matricole', 'Costruttore', 'Anno', 'Indicatori', 'Note'], key = { Matricole: 'matricole', Costruttore: 'costruttore', Anno: 'anno', Indicatori: 'indicatori', Note: 'note' };
        h += `<article class="fam"><div class="side"><div class="ph">Frontale e fianco<br>disegno nostro</div><div class="media"><span>Vista 3D · presto</span><span>Suoni · presto</span></div></div><div><h4>${esc(g.titolo)}${g.badge ? ` <span class="badge">${esc(g.badge)}</span>` : ''}</h4>` +

          (g.righe || []).map(r => `<tr${r.storico ? ' class="old"' : ''}>${cols.map(c => `<td>${esc(r[key[c]] || '—')}</td>`).join('')}</tr>`).join('') + `</tbody></table></div></div></article>`; }

        if (b.aspetti) h += `<div class="sigs">${b.aspetti.map(a => `<div class="sig2"><img src="${document.querySelector(a.sprite === 'go' ? 'img.sig.on' : 'img.sig.off').src}" alt="Segnale ${esc(a.nome.toLowerCase())}"><div><b>${esc(a.nome)}</b><span>${esc(a.testo)}</span></div></div>`).join('')}</div>`;
        if (b.vela) h += `<div class="sigs">${b.vela.map(v => `<div class="sig2">${vela(v.tipo === 'legale')}<div><b>${esc(v.nome)}</b><span>${esc(v.testo)}</span></div></div>`).join('')}</div>${b.da_completare ? `<div class="ask">${esc(b.da_completare)}</div>` : ''}`; }

        `<p style="margin-top:12px">${d.paragrafi[2]}</p><div class="fam" style="grid-template-columns:1fr"><div class="ph" style="min-height:180px">Schema del deposito · dal sinottico del gioco</div></div>` + src(s); }

function drawGrowth(S) {

  const sv = document.getElementById('lmap'), step = 48, x0 = 60, y = 80, order = c.stazioni.slice().reverse(), fi = q => c.fasi.findIndex(f => f.quando === q);

    h += `<circle cx="${x}" cy="${y}" r="6" fill="#fff" stroke="#0b2233" stroke-width="2"/><text x="${tx}" y="${ty}" transform="rotate(-35 ${tx} ${ty})" text-anchor="${up ? 'start' : 'end'}" fill="rgba(255,255,255,.85)" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-size="12" font-weight="600">${esc(s.nome.toUpperCase())}${s.deduzione ? '*' : ''}</text>`; });
  sv.innerHTML = h;

}
function spy() {
