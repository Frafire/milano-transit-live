# Builds the game with ./build.sh (timetable, packs, all the checks in tests/) and publishes docs/ on GitHub Pages.
# - push on main: build + checks + publish. If a check fails, the site stays on the last good version.
# - pull request: build + checks only, nothing is published.
# - "Run workflow" in the Actions tab: same as a push on main.
# One-time setting: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Sito

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one publish at a time; a newer push waits for the running one instead of cancelling it halfway
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # openpyxl: tests/nome_deposito_check.py reads Giovanni's Excel files
      - name: Python packages
        run: pip install openpyxl

      - name: Build and checks
        run: ./build.sh

      - name: Pages files
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
